<html lang="en"><head>

<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout: one column, one job per screen, phone first. Kraft price tag carries the SKU. */
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --surface-2:#E2E8E5; --ink:#101916; --ink-2:#44524C;
  --line:#BFCAC4; --accent:#0B5E50; --accent-ink:#FFFFFF; --accent-soft:#D3EAE3;
  --tag:#D9B98A; --tag-ink:#2A1E0F; --tag-line:#A88553;
  --warn:#7A4300; --warn-soft:#FBEACF; --danger:#A3261B; --danger-soft:#F8DDD9; --focus:#D99A00;
  --shadow:0 6px 24px rgba(16,25,22,.18);
  --f-body:"Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono:"Atkinson Hyperlegible Mono", ui-monospace, "Roboto Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#18211E; --surface-2:#232E2A; --ink:#EEF4F1; --ink-2:#AFBDB7;
  --line:#3A4843; --accent:#4CC7AE; --accent-ink:#06201A; --accent-soft:#173B34;
  --tag:#C9A673; --tag-ink:#1F160A; --tag-line:#8E6E40;
  --warn:#F3BB66; --warn-soft:#3A2A12; --danger:#FF8C7F; --danger-soft:#3E1B17; --focus:#FFC83D;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#18211E; --surface-2:#232E2A; --ink:#EEF4F1; --ink-2:#AFBDB7;
  --line:#3A4843; --accent:#4CC7AE; --accent-ink:#06201A; --accent-soft:#173B34;
  --tag:#C9A673; --tag-ink:#1F160A; --tag-line:#8E6E40;
  --warn:#F3BB66; --warn-soft:#3A2A12; --danger:#FF8C7F; --danger-soft:#3E1B17; --focus:#FFC83D;
  --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:19px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
#app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:28px} h2{font-size:24px} h3{font-size:20px}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--focus);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:2px solid var(--line);margin-bottom:16px}
.top h1{flex:1;min-width:0}
.back{min-height:56px;padding:0 18px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:19px;cursor:pointer}
.who{min-height:56px;padding:0 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;white-space:nowrap}

.stack{display:flex;flex-direction:column;gap:16px}
.section{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.label{font-size:17px;font-weight:700;color:var(--ink-2);letter-spacing:.02em}
.hint{font-size:17px;color:var(--ink-2)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:10px 20px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.huge{min-height:88px;font-size:24px;border-radius:20px}
.btn.quiet{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger);background:var(--danger-soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn small{display:block;font-weight:400;font-size:16px;opacity:.9}
.btn .stackbtn{display:flex;flex-direction:column;align-items:center}

/* chips */
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chips.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.chip{min-height:60px;padding:8px 10px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:19px;font-weight:700;cursor:pointer;text-align:center;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.wide{grid-column:1/-1}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-weight:700;font-size:18px}
input[type=text],input[type=search],textarea,.ed{width:100%;min-height:60px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:21px}
.ed{display:block;position:relative;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;cursor:text;outline:none}
.ed:focus{border-color:var(--accent)}
.ed.multi{min-height:120px}
.ed.blank::before{content:attr(data-ph);position:absolute;left:16px;top:14px;right:16px;color:var(--ink-2);opacity:.75;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
textarea{min-height:120px;resize:vertical}
input.talking,textarea.talking,.ed.talking{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.inline{display:flex;gap:10px}
.inline>input,.inline>.ed{flex:1;min-width:0}
.inline>.btn{flex:none}

/* kraft tag */
.tagwrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 82px);z-index:15;padding-block:4px 10px;background:var(--bg)}
.tag{display:flex;align-items:center;gap:14px;background:var(--tag);color:var(--tag-ink);border:2px solid var(--tag-line);border-radius:10px 22px 22px 10px;padding:12px 16px 12px 14px;position:relative}
.tag .hole{flex:none;width:18px;height:18px;border-radius:50%;background:var(--bg);border:2px solid var(--tag-line)}
.tag .sku{font-family:var(--f-mono);font-weight:700;font-size:23px;letter-spacing:.04em;word-break:normal;overflow-wrap:anywhere}
.tag .sub{font-size:15px;font-weight:700;opacity:.8}
.tag.empty .sku{font-family:var(--f-body);font-size:18px;letter-spacing:0;overflow-wrap:normal;hyphens:none}

/* photos */
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.photo{position:relative;aspect-ratio:1;max-width:100%;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:var(--surface-2)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo button{position:absolute;right:6px;bottom:6px;min-height:44px;padding:0 12px;border-radius:10px;border:0;background:rgba(0,0,0,.72);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.photo.main{grid-column:1/-1;aspect-ratio:4/3}

/* category tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{min-height:104px;padding:14px;border-radius:18px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:8px;text-align:left;cursor:pointer;color:var(--ink)}
.tile b{font-size:21px;line-height:1.2}
.tile code{font-family:var(--f-mono);font-size:15px;font-weight:700;background:var(--tag);color:var(--tag-ink);border-radius:6px;padding:2px 8px}
.tile.picked{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tile.plus{border-style:dashed;justify-content:center;align-items:center;text-align:center;color:var(--accent)}

/* notices */
.notice{border-radius:14px;padding:12px 14px;background:var(--warn-soft);color:var(--warn);font-size:17px;font-weight:700}
.ok{border-radius:14px;padding:12px 14px;background:var(--accent-soft);color:var(--ink);font-size:17px}

/* list */
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.row .thumb{flex:none;width:76px;height:76px;border-radius:12px;overflow:hidden;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-weight:700;color:var(--ink-2);font-size:16px}
.row .thumb img{width:100%;height:100%;object-fit:cover}
.row .txt{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.row .t{font-weight:700;font-size:20px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .s{font-family:var(--f-mono);font-size:16px;color:var(--ink-2);word-break:normal;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-family:var(--f-body)}
.pill.ex{background:var(--warn-soft);color:var(--warn)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2);border:2px dashed var(--line);border-radius:18px}

/* bottom bars */
#app:has(.tabs){padding-bottom:140px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{min-height:72px;border:0;background:transparent;font-size:15px;font-weight:700;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border-top:5px solid transparent;padding:0 2px}
.tabs button b{font-size:20px;color:var(--ink)}
.tabs button[aria-pressed="true"]{color:var(--accent);border-top-color:var(--accent);background:var(--accent-soft)}
.tabs button[aria-pressed="true"] b{color:var(--accent)}
.roundsave{flex:none;width:68px;height:68px;border-radius:50%;border:3px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:19px;cursor:pointer;box-shadow:0 2px 8px rgba(16,25,22,.25);display:flex;align-items:center;justify-content:center;padding:0}
.roundsave:active{transform:scale(.94)}
.tagprev{display:flex;justify-content:center;padding:18px;background:var(--surface-2);border-radius:18px}
.tagprev img{display:block;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);border-radius:6px;max-width:100%;max-height:340px;width:auto;height:auto}
.chips.tall .chip{min-height:60px;font-size:19px}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}html,body{background:#fff!important;margin:0!important;padding:0!important;min-height:0!important}#printArea{display:block!important;overflow:hidden;page-break-after:avoid;break-after:avoid}#printArea img{display:block;width:100%;height:100%}}

/* lookup */
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.links a{min-height:60px;font-size:18px}

/* mic panel */
#mic{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
#mic .card{pointer-events:auto;max-width:620px;margin:0 auto;background:var(--surface);border:3px solid var(--accent);border-radius:22px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px}
#mic .into{font-size:16px;font-weight:700;color:var(--ink-2)}
#mic .into b{display:block;font-size:24px;color:var(--ink)}
#mic .talk{min-height:84px;font-size:24px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:14px}
#mic .talk .dot{width:22px;height:22px;border-radius:50%;background:currentColor}
#mic .talk.on{background:var(--danger);color:#fff}
#mic .talk.on .dot{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.55);opacity:.55}}
@media (prefers-reduced-motion:reduce){#mic .talk.on .dot{animation:none}}
#mic .live{min-height:28px;font-size:19px;color:var(--ink-2);font-style:italic}
#mic .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#mic .row2 .btn{min-height:60px}
#mic .card.compact{flex-direction:row;align-items:stretch;gap:10px;padding:10px}
#mic .card.compact .talk{flex:1;min-width:0;min-height:72px;font-size:22px;border-radius:16px;padding:6px 14px;justify-content:flex-start;text-align:left}
#mic .card.compact .talk .lines{display:flex;flex-direction:column;min-width:0}
#mic .card.compact .talk small{font-size:16px;font-weight:400;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mic .card.compact .hide{flex:none;min-height:72px;min-width:84px;padding:0 14px;font-size:19px}
#micTab{position:fixed;right:calc(8px + env(safe-area-inset-right,0px));top:45%;z-index:40;min-height:64px;padding:0 16px;border-radius:16px;border:3px solid var(--accent);background:var(--surface);color:var(--accent);font-weight:700;font-size:19px;box-shadow:var(--shadow);cursor:pointer}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#sheet .card{background:var(--surface);border-radius:22px;padding:20px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:14px}

details.rec summary{min-height:56px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.mono{font-family:var(--f-mono);font-size:16px;word-break:normal;overflow-wrap:anywhere}
.hist{display:flex;flex-direction:column;gap:6px;font-size:16px;color:var(--ink-2)}
.big-ok{font-size:30px;font-weight:700;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:14px 20px;border-radius:14px;font-weight:700;max-width:90vw}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head><body>
<div id="app"></div>
<div id="mic" hidden></div>
<div id="printArea"></div>
<style id="pageStyle"></style>
<button id="micTab" hidden data-act="micshow">Talk</button>
<div id="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>
<input id="camIn" class="vh" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
<input id="pickIn" class="vh" type="file" accept="image/*" tabindex="-1" aria-hidden="true">

<template id="bundleTpl"><style>
:root{--bg:#EEF1EF;--surface:#fff;--ink:#101916;--ink-2:#44524C;--line:#C5CFCA;--accent:#0B5E50;--accent-ink:#fff;--tag:#D9B98A;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0E1412;--surface:#18211E;--ink:#EEF4F1;--ink-2:#AFBDB7;--line:#33413B;--accent:#3FA48E;--accent-ink:#06120F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}

.meta{color:var(--ink-2);font-size:16px;display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:14px}
.meta b{color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.bar button{min-height:52px;padding:0 18px;border-radius:14px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer}
.bar button.q{background:var(--surface);color:var(--ink);border-color:var(--line)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:14px}
.filters input,.filters select{min-height:52px;width:100%;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
@media (max-width:600px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}
.count{color:var(--ink-2);font-size:15px;margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start}
.ph{width:120px;height:120px;border-radius:12px;background:var(--bg);border:0;padding:0;overflow:hidden;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-weight:700}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;border-radius:8px;padding:1px 7px}
.t{font-weight:700;font-size:19px;margin:0 0 2px;overflow-wrap:anywhere}
.sku{display:inline-block;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:15px;background:var(--tag);color:#2A1E0E;border-radius:6px;padding:1px 8px;margin-bottom:6px;overflow-wrap:anywhere}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:15px}
dt{color:var(--ink-2)}dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.id{grid-column:1/-1;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--ink-2);margin-top:4px;overflow-wrap:anywhere}
.empty{padding:30px;text-align:center;color:var(--ink-2);border:2px dashed var(--line);border-radius:16px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9;padding:12px}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:calc(100vh - 150px);object-fit:contain;border-radius:8px}
.lb .cap{color:#fff;margin:10px 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;text-align:center}
.lb .ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lb button,.lb a{min-height:52px;min-width:64px;padding:0 16px;border-radius:14px;border:2px solid #fff;background:transparent;color:#fff;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
footer{color:var(--ink-2);font-size:13px;margin:24px 0 8px}
</style>
<div class="wrap">

<div class="meta" id="meta"></div>

</div>

<script>
(function(){
var D=JSON.parse(document.getElementById('bundle-data').textContent);
function $(s){return document.querySelector(s);}

function day(t){return new Date(t).toLocaleDateString([], {year:'numeric',month:'short',day:'numeric'});}
function when(t){return new Date(t).toLocaleString([], {year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}
var BN={BB:'Barn (BB)',SB:'Sales building (SB)'};
var w=D.worker||{};

/* Test 001/002 seeded three sample items (marked example:true) and two sample collections. Remove only those. */
function dropSamples(){
 const had=S.items.some(i=>i.example);if(!had)return false;
 S.items=S.items.filter(i=>!i.example);
 const used=new Set();for(const i of S.items)for(const c of (i.cols||[]))used.add(c);
 S.collections=(S.collections||[]).filter(c=>!(['Jazz LPs','Front window'].includes(c)&&!used.has(c)));
 for(const k of ['MED-REC-SB-D','MUS-GTR-BB-J','TOY-FIG-SB-D']){if(S.counters[k]===1&&!S.items.some(i=>i.sku&&i.sku.startsWith(k+'-')))delete S.counters[k];}

/* Everything lives on the phone in IndexedDB: one record for settings, one per item. */
async function load(){
 try{db=await openDb();}catch(e){db=null;}
 if(!db){try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&o.v===1)return o;}}catch(e){}return fresh();}
 try{
  const tx=db.transaction(['meta','items']);
  const meta=await reqP(tx.objectStore('meta').get('state'));
  const items=await reqP(tx.objectStore('items').getAll());
  if(meta&&meta.v===1){meta.items=items;for(const i of items)savedAt[i.id]=i.updated;return meta;}
 }catch(e){}
 return fresh();
}
function persist(){
 if(!db){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast("The phone is out of room. Send today's work, then free up space.");}return;}
 try{
  const tx=db.transaction(['meta','items'],'readwrite');
  const m={};for(const k in S)if(k!=='items')m[k]=S[k];
  tx.objectStore('meta').put(m,'state');
  const st=tx.objectStore('items'),next={};
  for(const it of S.items){next[it.id]=it.updated;if(savedAt[it.id]!==it.updated)st.put(it);}
  for(const id of Object.keys(savedAt))if(!(id in next))st.delete(id);
  tx.onerror=tx.onabort=()=>{savedAt={};toast("That didn't save on the phone. Try again.");};
  savedAt=next;
 }catch(e){savedAt={};toast("That didn't save on the phone. Try again.");}
}

function allCats(){return CATS.map(c=>({code:c.code,name:c.name,subs:c.subs.map(([code,name])=>({code,name})).concat((S.customSubs[c.code]||[]))})).concat(S.customCats.map(c=>({code:c.code,name:c.name,custom:true,subs:S.customSubs[c.code]||[]})));}
function catOf(code){return allCats().find(c=>c.code===code);}
function subOf(cat,code){const c=catOf(cat);return c&&c.subs.find(s=>s.code===code);}
function catLabel(d){const c=catOf(d.cat);if(!c)return '';const s=d.sub&&subOf(d.cat,d.sub);return c.name+(s?' › '+s.name:'');}
function makeCode(name,taken){
 const letters=(name.toUpperCase().match(/[A-Z]/g)||['X']).join('');
 const cands=[letters.slice(0,3)];
 const cons=letters[0]+letters.slice(1).replace(/[AEIOU]/g,'');cands.push(cons.slice(0,3));
 for(let i=1;i<letters.length-1;i++)for(let j=i+1;j<letters.length;j++)cands.push(letters[0]+letters[i]+letters[j]);
 for(let c of cands){c=(c+'XXX').slice(0,3);if(!taken.includes(c)&&c!=='000')return c;}
 for(let n=0;n<1000;n++){const c=(letters[0]+String(n).padStart(2,'0')).slice(0,3);if(!taken.includes(c))return c;}
 return 'ZZZ';
}
function template(d){return T[d.cat+'-'+d.sub]||T[d.cat]||[];}
function skuKey(d){return [d.cat,d.sub||'000',d.origin,d.worker].join('-');}
function previewSku(d){
 if(!d.cat)return null;
 const k=skuKey(d);
 if(d.sku&&d.sku.slice(0,-5)===k)return d.sku;
 return k+'-'+String((S.counters[k]||0)+1).padStart(4,'0');
}
function fmtTime(t){const d=new Date(t);return d.toLocaleDateString([], {month:'short',day:'numeric'})+', '+d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});}
function sameDay(a,b){const x=new Date(a),y=new Date(b);return x.getFullYear()===y.getFullYear()&&x.getMonth()===y.getMonth()&&x.getDate()===y.getDate();}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600);}

const TAGS={

 s225:{label:'2¼ × 1¼ inch sticker',w:2.25,h:1.25,u:'in'},

function inches(t,v){return t.u==='mm'?v/25.4:v;}
function qrMatrix(text){const q=qrcode(0,'M');q.addData(text,/^[0-9A-Z $%*+\-.\/:]*$/.test(text)?'Alphanumeric':'Byte');q.make();const n=q.getModuleCount();return {n,dark:(r,c)=>q.isDark(r,c)};}
function fitFont(ctx,lines,font,maxW,maxPx){let px=Math.floor(maxPx);while(px>8){ctx.font=font(px);if(lines.every(l=>ctx.measureText(l).width<=maxW))return px;px--;}return px;}
function wrapLines(ctx,text,maxW,maxLines){const words=String(text||'').trim().split(/\s+/).filter(Boolean);const out=[];let cur='';
 for(let i=0;i<words.length;i++){const t=cur?cur+' '+words[i]:words[i];if(ctx.measureText(t).width<=maxW){cur=t;continue;}
  if(cur){out.push(cur);cur=words[i];}else{cur=words[i];}
  if(out.length===maxLines){cur='';break;}}
 if(cur&&out.length<maxLines)out.push(cur);
 const used=out.join(' ').split(/\s+/).filter(Boolean).length;
 if(used<words.length&&out.length){let l=out[out.length-1];while(l&&ctx.measureText(l+'…').width>maxW)l=l.slice(0,-1);out[out.length-1]=l.replace(/\s+$/,'')+'…';}
 return out.map(l=>{while(ctx.measureText(l).width>maxW&&l.length>1)l=l.slice(0,-2)+'…';return l;});}
function skuLines(ctx,sku,font,maxW,maxPx,minPx){
 const one=fitFont(ctx,[sku],font,maxW,maxPx);if(one>=minPx)return {lines:[sku],px:one};
 const parts=sku.split('-');let best=null;
 for(let k=1;k<parts.length;k++){const L=[parts.slice(0,k).join('-')+'-',parts.slice(k).join('-')];const px=fitFont(ctx,L,font,maxW,maxPx);if(!best||px>best.px)best={lines:L,px};}
 return best&&best.px>one?best:{lines:[sku],px:one};}
function tagCanvas(it,key,dpi){
 const t=TAGS[key];const W=Math.round(inches(t,t.w)*dpi),H=Math.round(inches(t,t.h)*dpi);
 const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');
 ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.fillStyle='#000';ctx.textBaseline='alphabetic';
 const mono=px=>'700 '+px+'px "Atkinson Hyperlegible Mono", "Roboto Mono", monospace';
 const body=px=>'400 '+px+'px "Atkinson Hyperlegible", Roboto, system-ui, sans-serif';
 const m=Math.round(0.07*dpi);
 const Q=qrMatrix(it.id);
 function drawQr(x,y,size){const px=Math.floor(size/Q.n);const off=Math.floor((size-px*Q.n)/2);for(let r=0;r<Q.n;r++)for(let cc=0;cc<Q.n;cc++)if(Q.dark(r,cc))ctx.fillRect(x+off+cc*px,y+off+r*px,px,px);}
 const sku=it.sku||'';const title=it.title||'';
 function textBlock(x,y,w,h,center){
  const sk=skuLines(ctx,sku,mono,w,Math.min(h*0.3,dpi*0.2),Math.round(dpi*0.105));
  const lh=Math.round(sk.px*1.12);
  ctx.font=body(10);let tp=Math.round(Math.min(sk.px*0.72,dpi*0.12));ctx.font=body(tp);
  let tl=title?wrapLines(ctx,title,w,2):[];const tlh=Math.round(tp*1.18);
  const gap=tl.length?Math.round(sk.px*0.35):0;
  let total=sk.lines.length*lh+gap+tl.length*tlh;
  if(total>h&&tl.length===2){tl=wrapLines(ctx,title,w,1);total=sk.lines.length*lh+gap+tlh;}
  if(total>h&&tl.length){tl=[];total=sk.lines.length*lh;}
  let yy=y+Math.max(0,(h-total)/2);ctx.textAlign=center?'center':'left';const xx=center?x+w/2:x;
  ctx.font=mono(sk.px);for(const l of sk.lines){yy+=lh;ctx.fillText(l,xx,yy-Math.round(lh*0.18));}
  yy+=gap;ctx.font=body(tp);for(const l of tl){yy+=tlh;ctx.fillText(l,xx,yy-Math.round(tlh*0.2));}
 }
 if(W>=H){const q=H-2*m;drawQr(m,m,q);const x=m+q+Math.round(0.07*dpi);textBlock(x,m,W-x-m,H-2*m,false);}
 else{const hole=t.hole?Math.round(0.6*dpi):0;const q=Math.min(W-2*m,Math.round((H-hole-2*m)*0.58));drawQr(Math.round((W-q)/2),hole+m,q);const y=hole+m+q;textBlock(m,y,W-2*m,H-y-m,true);}
 return c;
}

/* ---------- export ---------- */
function todayItems(){return S.items.filter(i=>sameDay(i.updated,Date.now()));}
function csvOf(items){
 const cols=['sku','id','title','category','subcategory','condition','quantity','origin','kept_building','kept_spot','collections','status','details','notes','made_by','created','updated'];
 const q=v=>{v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
 const rows=items.map(i=>{const c=catOf(i.cat),s=subOf(i.cat,i.sub);
  const det=Object.entries(i.fields||{}).filter(([,v])=>v).map(([k,v])=>k+': '+v).concat(i.extra.filter(x=>x.value).map(x=>x.label+': '+x.value)).join('; ');
  return [i.sku,i.id,i.title,c?c.name:'',s?s.name:'',i.cond,i.qty,i.origin,i.locB,i.loc,i.cols.join('; '),(STATUS.find(x=>x[0]===i.status)||[])[1],det,i.notes,i.worker,new Date(i.created).toISOString(),new Date(i.updated).toISOString()].map(q).join(',');});
 return cols.join(',')+'\n'+rows.join('\n')+'\n';
}
/* One self-contained HTML report per day. The page shows every item with its photos, and it
 carries the full data in <script id="bundle-data"> so a master inventory can import it.
 Import rule for the master: match on item id (permanent ULID); same id = update if
 updatedAt is newer, never a duplicate; the same bundleId imported twice changes nothing. */
function bundleOf(items){
 const w=S.worker||{letter:'X',name:''};const now=Date.now();let pc=0;
 const its=items.map(i=>{const c=catOf(i.cat),s=subOf(i.cat,i.sub),st=STATUS.find(x=>x[0]===i.status);const base=i.sku||i.id;
  const o=Object.assign({},i,{photos:(i.photos||[]).map((p,n)=>{pc++;const m=(String(p.full).match(/^data:image\/(\w+)/)||[])[1]||'jpeg';return {name:base+'-'+(n+1)+'.'+(m==='jpeg'?'jpg':m),data:p.full};}),
   catName:c?c.name:'',subName:s?s.name:'',statusLabel:st?st[1]:i.status,createdAt:new Date(i.created).toISOString(),updatedAt:new Date(i.updated).toISOString()});
  delete o.isNew;delete o.dirty;delete o.statusSet;return o;});
 const times=items.flatMap(i=>[i.created,i.updated]).filter(Boolean);
 return {schemaVersion:1,kind:'store-inventory-bundle',bundleId:ulid(now),app:'store-inventory',appVersion:'test-008',
  worker:{letter:w.letter,name:w.name},createdAt:new Date(now).toISOString(),
  range:{from:new Date(Math.min(...times)).toISOString(),to:new Date(Math.max(...times)).toISOString()},
  buildings:[...new Set(items.map(i=>i.origin).filter(Boolean))],count:items.length,photoCount:pc,csv:csvOf(items),items:its};
}
function bundleHtml(b){
 const tpl=$('#bundleTpl').innerHTML;
 const json=JSON.stringify(b).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
 return '<!doctype html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc('Inventory report '+(b.worker.letter||'')+' '+b.createdAt.slice(0,10))+'</title></head><body>'+tpl.split('__BUNDLE_DATA__').join(json)+'</body></html>\n';
}

async function saveFile(name,data,fallbackCsv){
 const type=name.endsWith('.csv')?'text/csv':name.endsWith('.html')?'text/html':name.endsWith('.png')?'image/png':'application/json';
 let file=null;try{file=new File([data],name,{type});}catch(e){}
 if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
  try{await navigator.share({files:[file],title:name});return;}catch(e){if(e&&e.name==='AbortError')return;}
 }
 try{const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('Saved '+name+' in Downloads');}

}
function dataUrlFile(u,name){const i=u.indexOf(',');const m=(u.slice(0,i).match(/data:([^;]+)/)||[])[1]||'image/jpeg';const bin=atob(u.slice(i+1));const a=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)a[j]=bin.charCodeAt(j);return new File([a],name,{type:m});}

function loadImg(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>res({im,url});im.onerror=()=>{URL.revokeObjectURL(url);

function shrink(im,max,q){const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q);}

 autofill strip (key, card and pin icons) for form fields, so these never trigger it.
 Gboard and its own toolbar, mic included, work as usual. Each box keeps a .value like an input. */
function caretEnd(el){try{const r=document.createRange();r.selectNodeContents(el);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r);}catch(e){}}
function makeEd(src){
 const multi=src.tagName==='TEXTAREA';const d=document.createElement('div');
 d.className='ed'+(multi?' multi':'');
 try{d.contentEditable='plaintext-only';}catch(e){d.contentEditable='true';}
 if(d.contentEditable!=='plaintext-only')d.contentEditable='true';
 d.setAttribute('role','textbox');if(multi)d.setAttribute('aria-multiline','true');
 for(const a of ['id','style','autocapitalize','spellcheck'])if(src.hasAttribute(a))d.setAttribute(a,src.getAttribute(a));
 for(const [k,v] of Object.entries(src.dataset))d.dataset[k]=v;
 const lab=src.closest('label.field,.field');const ls=lab&&lab.querySelector('span');
 d.setAttribute('aria-label',(ls&&ls.textContent)||src.getAttribute('placeholder')||'Text');
 if(src.placeholder)d.dataset.ph=src.placeholder;
 const max=+src.getAttribute('maxlength')||0;
 Object.defineProperty(d,'value',{get(){let t=d.innerText||'';if(d.lastChild&&d.lastChild.nodeName==='BR')t=t.replace(/\n$/,'');if(t==='\n')t='';if(!multi)t=t.replace(/\n/g,' ');return t;},
  set(v){v=String(v==null?'':v);if(max)v=v.slice(0,max);d.textContent=v;d.classList.toggle('blank',!v);if(document.activeElement===d)caretEnd(d);}});
 d.setSelectionRange=()=>caretEnd(d);
 d.addEventListener('input',()=>{if(max&&d.value.length>max)d.value=d.value.slice(0,max);d.classList.toggle('blank',!d.value);},true);
 d.addEventListener('keydown',e=>{if(e.key==='Enter'&&!multi){e.preventDefault();}},true);
 d.value=multi?src.value:src.getAttribute('value')||src.value||'';
 src.replaceWith(d);return d;
}
function upgradeFields(root){root.querySelectorAll('input[type=text],input[type=search],textarea:not([readonly])').forEach(makeEd);}
document.addEventListener('click',e=>{const lab=e.target.closest&&e.target.closest('label.field');if(!lab||e.target.closest('.ed'))return;const ed=lab.querySelector('.ed');if(ed){e.preventDefault();ed.focus();caretEnd(ed);}});

/* ---------- typing ---------- */
document.addEventListener('input',e=>{
 const el=e.target,k=el.dataset&&el.dataset.key;if(!k)return;
 const val=el.value;
 if(k==='search'){search=val;const y=window.scrollY;const rows=document.querySelector('.rows');
  /* update the list without rebuilding the search box */
  const tmp=document.createElement('div');tmp.innerHTML=vHome();const nr=tmp.querySelector('.rows');if(rows&&nr)rows.replaceWith(nr);const h2=document.querySelector('#app h2'),nh=tmp.querySelector('h2');if(h2&&nh)h2.replaceWith(nh);window.scrollTo(0,y);return;}
 if(k==='letter'){const L=val.toUpperCase().replace(/[^A-Z]/g,'').slice(0,1);el.value=L;if(L){S.worker={name:L==='D'?'Dad':L==='J'?'Joshua':'Worker '+L,letter:L};persist();}return;}
 if(k==='newcat'||k==='newsub'){newText[k]=val;const p=$('#codePrev');if(p)p.innerHTML=codePreview(k);return;}
 if(k==='newcol'||k==='newx'){newText[k]=val;return;}
 if(!draft)return;
 if(k==='title')draft.title=val;
 else if(k==='notes')draft.notes=val;
 else if(k==='loc')draft.loc=val;
 else if(k.startsWith('f:'))draft.fields[k.slice(2)]=val;
 else if(k.startsWith('x:')){const x=draft.extra[+k.slice(2)];if(x)x.value=val;}
 draft.dirty=true;
 if(k==='title'||k.startsWith('f:')){const dup=$('#dup');if(dup)dup.innerHTML=dupHtml(draft);const l=$('#links');if(l)l.innerHTML=linksHtml(draft);}
});
document.addEventListener('keydown',e=>{
 if(e.key!=='Enter')return;const k=e.target.dataset&&e.target.dataset.key;
 const map={newcat:'addcatok',newsub:'addsubok',newcol:'addcolok',newx:'addxok'};
 if(map[k]){e.preventDefault();const b=document.querySelector('[data-act="'+map[k]+'"]');if(b)b.click();}
});

/* ---------- mic panel ---------- */
const mic={key:null,label:'',listening:false,engine:null,base:'',committed:'',collapsed:false,compact:false,typeKey:null,rec:null,note:'',live:''};
let dict=null,dictTried=false,dictBad=false;
function initDict(){
 if(dictTried)return;dictTried=true;
 try{if(!(window.claude&&window.claude.use)){dictTried=false;return;}
  window.claude.use('dictation').then(d=>{if(!d)return;dict=d;
   d.onPartial(({text})=>{if(mic.engine!=='claude')return;mic.live=text;setField(text?join(mic.committed,text):mic.committed);updLive();});
   d.onFinal(({text})=>{if(mic.engine!=='claude')return;mic.committed=join(mic.committed,text);mic.live='';setField(mic.committed);updLive();});
   d.onState(({state,reason})=>{if(mic.engine!=='claude')return;mic.listening=state!=='idle';
    if(state==='idle'){mic.live='';const msgs={not_granted:'The microphone is off for this page. You can type in the box for now.',unavailable:'Talking isn’t available here. You can type in the box for now.',rate_limited:'Too many people talking at once. Try again in a moment.',upstream_error:'The microphone stopped. Tap Talk to try again.',time_limit:'Listening stopped after an hour. Tap Talk to go on.'};
     if(reason==='unavailable')dictBad=true;if(msgs[reason])mic.note=msgs[reason];}
    renderMic();});
  }).catch(()=>{});
 }catch(e){}
}
function join(a,b){if(!b)return a;if(!a)return b.replace(/^\s+/,'');if(/\s$/.test(a))return a+b.replace(/^\s+/,'');if(/^\s/.test(b))return a+b;return a+' '+b;}
function fieldEl(){return mic.key?document.querySelector('[data-key="'+mic.key.replace(/"/g,'\\"')+'"]'):null;}
function setField(v){const el=fieldEl();if(!el)return;el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));if(el.tagName==='TEXTAREA'||el.classList.contains('multi'))el.scrollTop=el.scrollHeight;}
function openMic(key,label){initDict();if(mic.listening)stopMic();const old=fieldEl();if(old)old.classList.remove('talking');mic.key=key;mic.label=label;mic.collapsed=false;mic.compact=true;mic.note='';renderMic();}
function closeMic(){const el=fieldEl();if(el)el.classList.remove('talking');mic.key=null;mic.compact=false;$('#mic').hidden=true;$('#micTab').hidden=true;$('#app').style.paddingBottom='';}
function SR(){return window.SpeechRecognition||window.webkitSpeechRecognition;}
function toggleTalk(){if(mic.listening){stopMic();return;}startMic();}
function startMic(){
 mic.compact=false;
 const el=fieldEl();mic.base=el?el.value:'';mic.committed=mic.base;mic.note='';mic.live='';
 if(dict&&!dictBad){
  mic.engine='claude';
  const p=dict.start();
  mic.listening=true;
  p.catch(err=>{mic.listening=false;const c=err&&err.code;
   mic.note=c==='not_granted'?'The microphone is off for this page. You can type in the box for now.':c==='dismissed'?'Tap Talk again and choose Allow to use the microphone.':c==='unavailable'?(dictBad=true,'Talking isn’t available here. You can type in the box for now.'):c==='stopped'?'':'The microphone didn’t start. Tap Talk to try again.';
   renderMic();});
 }else if(SR()){
  try{const r=new (SR())();mic.rec=r;mic.engine='web';r.lang=navigator.language||'en-US';r.continuous=true;r.interimResults=true;
   r.onresult=ev=>{let fin='',int='';for(let i=0;i<ev.results.length;i++){const t=ev.results[i][0].transcript;if(ev.results[i].isFinal)fin=join(fin,t);else int=join(int,t);}
    mic.committed=join(mic.base,fin);mic.live=int;setField(int?join(mic.committed,int):mic.committed);updLive();};
   r.onerror=ev=>{mic.note=ev.error==='not-allowed'||ev.error==='service-not-allowed'?'The microphone is off for this app. Allow it in Chrome’s site settings, or type in the box for now.':ev.error==='no-speech'?'I didn’t hear anything. Tap Talk and try again.':'The microphone stopped. Tap Talk to try again.';};
   r.onend=()=>{mic.listening=false;mic.live='';renderMic();};
   r.start();mic.listening=true;}
  catch(e){mic.listening=false;mic.note='Talking isn’t available on this phone. You can type in the box for now.';}
 }else{mic.note='Talking isn’t available on this phone. You can type in the box for now.';}
 if(mic.listening&&el){el.blur();el.classList.add('talking');}
 renderMic();
}
function stopMic(){mic.listening=false;if(mic.engine==='claude'&&dict){dict.stop().catch(()=>{});}else if(mic.rec){try{mic.rec.stop()}catch(e){}}const el=fieldEl();if(el)el.classList.remove('talking');mic.live='';renderMic();}
function updLive(){const l=$('#micLive');if(l)l.textContent=mic.live?'“'+mic.live+'”':(mic.listening?'Listening…':'');}
function renderMic(){
 const p=$('#mic'),tab=$('#micTab');
 if(!mic.key){p.hidden=true;tab.hidden=true;return;}
 if(mic.collapsed){p.hidden=true;tab.hidden=false;tab.textContent=mic.listening?'Listening…':'Talk';return;}
 tab.hidden=true;p.hidden=false;
 if(mic.compact&&!mic.listening){
  p.innerHTML=`<div class="card compact" role="region" aria-label="Talk to type"><button class="talk" data-act="mictalk"><span class="dot"></span><span class="lines">Tap to talk<small>into: ${esc(mic.label)}</small></span></button><button class="btn hide" data-act="mictype">Type instead</button></div>`;
  place();keepClear();return;
 }
 p.innerHTML=`<div class="card" role="region" aria-label="Talk to type">
  <div class="into">Speaking into:<b>${esc(mic.label)}</b></div>
  <button class="talk ${mic.listening?'on':''}" data-act="mictalk"><span class="dot"></span>${mic.listening?'Listening. Tap to stop':'Tap to talk'}</button>
  <div class="live" id="micLive" aria-live="polite">${mic.live?esc('“'+mic.live+'”'):(mic.listening?'Listening…':'')}</div>
  ${mic.note?`<div class="notice">${esc(mic.note)}</div>`:''}
  <button class="btn" data-act="mictype">Type instead</button>
  <div class="row2"><button class="btn" data-act="micaside">Move aside</button><button class="btn primary" data-act="micdone">Done</button></div>
 </div>`;
 place();keepClear();
 const el=fieldEl();if(el)el.classList.toggle('talking',mic.listening);
}
/* The panel must never cover the field it speaks into: make room under the page and scroll the field above the panel. */
function keepClear(){
 const p=$('#mic');if(p.hidden){$('#app').style.paddingBottom='';return;}
 const card=p.querySelector('.card');const el=fieldEl();if(!card)return;
 const ch=card.getBoundingClientRect().height;$('#app').style.paddingBottom=Math.max(140,ch+40)+'px';
 if(!el)return;
 requestAnimationFrame(()=>{const top=card.getBoundingClientRect().top,r=el.getBoundingClientRect();
  const gap=16;if(r.bottom>top-gap)window.scrollBy(0,r.bottom-top+gap);
  else{const hdr=document.querySelector('.top');const hb=hdr?hdr.getBoundingClientRect().bottom:0;if(r.top<hb+8)window.scrollBy(0,r.top-hb-8);}});
}

function place(){const p=$('#mic');const vv=window.visualViewport;const off=vv?Math.max(0,window.innerHeight-vv.height-vv.offsetTop):0;p.style.bottom=off+'px';}
let clearT=null;function settle(){place();clearTimeout(clearT);clearT=setTimeout(keepClear,120);}
if(window.visualViewport){visualViewport.addEventListener('resize',settle);visualViewport.addEventListener('scroll',place);}
window.addEventListener('resize',settle);
document.addEventListener('focusin',e=>{const el=e.target;if(el.dataset&&el.dataset.speak){if(mic.typeKey===el.dataset.key)return;mic.typeKey=null;openMic(el.dataset.key,el.dataset.speak);}});
/* keep the panel's button taps from stealing the field before we read it */
$('#mic').addEventListener('pointerdown',e=>{if(e.target.closest('button'))e.preventDefault();});

initDict();setTimeout(initDict,1200);
(async function boot(){
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});}catch(e){}
 S=await load();if(dropSamples())persist();screen=S.worker?'home':'setup';render(true);
})();
})();
</script>
<script>
if('serviceWorker' in navigator){const hadSW=!!navigator.serviceWorker.controller;let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&!reloaded){reloaded=true;location.reload();}});window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});});}
</script>
